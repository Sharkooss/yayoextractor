services:
  app:
    build:
      context: .
      args:
        # Fourni par la CI (horodatage) pour forcer la reinstallation de
        # yt-dlp a chaque deploiement, voir Dockerfile.
        YTDLP_REFRESH: ${YTDLP_REFRESH:-0}
    container_name: yayoextractor
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      potprovider:
        condition: service_started
      # L'app attend que le tunnel WARP soit monté : démarré trop tôt, le
      # SOCKS laisse sortir le trafic en direct et YouTube bloque l'IP du VPS.
      warp:
        condition: service_healthy
    volumes:
      - downloads:/data
    networks:
      - default
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.yayoextractor.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.yayoextractor.entrypoints=websecure
      - traefik.http.routers.yayoextractor.tls.certresolver=letsencrypt
      - traefik.http.services.yayoextractor.loadbalancer.server.port=8000

  # Fournit les PO tokens que YouTube exige des IP de serveur,
  # sans cookies ni compte Google. Réseau interne uniquement.
  # Version épinglée et alignée sur le plugin pip de requirements.txt : les
  # deux doivent partager le même major.minor, sinon plus aucun PO token n'est
  # généré. Le déploiement vérifie l'alignement et échoue s'il est rompu.
  potprovider:
    image: brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION:-1.3.2}
    container_name: yayoextractor-potprovider
    restart: unless-stopped
    networks:
      - default

  # Proxy Cloudflare WARP : YouTube bloque les IP de datacenter (anti-bot),
  # tout le trafic yt-dlp sort par ce tunnel. Réseau interne uniquement.
  # Version épinglée : suivre `latest` ferait tirer une image neuve par le
  # déploiement automatique du lundi 4h, et un tunnel cassé à ce moment-là
  # coupe tous les téléchargements sans que personne ne regarde. Le workflow
  # signale les nouvelles versions dans son log, le bump reste manuel.
  warp:
    image: caomingjun/warp:2026.7.1377.0-2.12.0
    container_name: yayoextractor-warp
    restart: unless-stopped
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      - WARP_SLEEP=3
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    networks:
      - default

volumes:
  downloads:
  warp_data:

networks:
  web:
    external: true
