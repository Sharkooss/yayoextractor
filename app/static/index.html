<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yayo Extractor — Ta musique YouTube en MP3</title>
  <meta name="description" content="Cherche une chanson sur YouTube et récupère-la en MP3, tout simplement.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff6b35'/%3E%3Cpath d='M9.5 16.5V8l7-1.3v8.3' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='7.7' cy='16.5' r='1.9' fill='white'/%3E%3Ccircle cx='14.7' cy='15' r='1.9' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.5"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
      <symbol id="i-sad" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></symbol>
    </defs>
  </svg>

  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <header>
    <h1>
      <span class="logo"><svg class="icon" aria-hidden="true"><use href="#i-music"/></svg></span>
      Yayo&nbsp;Extractor
      <span class="version-badge">V2</span>
    </h1>
    <p class="tagline">Ta musique YouTube en MP3, en deux clics.</p>
  </header>

  <main>
    <section class="card" id="search-card">
      <h2><span class="step">1</span> Cherche ta chanson</h2>
      <form id="search-form" class="search-row">
        <input id="search-input" type="search" placeholder="Ex : Charles Aznavour — La Bohème"
               autocomplete="off" enterkeyhint="search">
        <button type="submit" class="btn btn-primary" id="search-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <span id="search-btn-label">Rechercher</span>
        </button>
      </form>
      <p class="hint" id="search-hint" hidden></p>
      <div id="results-placeholder" aria-hidden="true">
        <svg class="icon" aria-hidden="true"><use href="#i-music"/></svg>
        <p>Les résultats s'afficheront ici.</p>
      </div>
      <div id="results" class="results" hidden></div>
    </section>

    <section class="card" id="download-card">
      <h2><span class="step">2</span> Vérifie et lance</h2>
      <label class="field-label" for="url-input">
        Le lien de la vidéo <small>(il se remplit tout seul quand tu choisis, ou colle-le ici)</small>
      </label>
      <input id="url-input" type="url" placeholder="https://www.youtube.com/watch?v=…"
             autocomplete="off" spellcheck="false">
      <div class="format-row">
        <button type="button" class="format-pill selected" data-format="mp3">
          <span class="pill-top"><svg class="icon" aria-hidden="true"><use href="#i-music"/></svg> Musique</span>
          <small>fichier MP3</small>
        </button>
        <button type="button" class="format-pill" data-format="mp4">
          <span class="pill-top"><svg class="icon" aria-hidden="true"><use href="#i-film"/></svg> Vidéo</span>
          <small>fichier MP4</small>
        </button>
      </div>
      <button type="button" class="btn btn-go" id="go-btn">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        C'est parti !
      </button>
      <p class="hint error" id="inline-error" hidden></p>
    </section>
  </main>

  <footer>
    Fait avec <svg class="icon heart" aria-hidden="true"><use href="#i-heart"/></svg> pour Yayo
  </footer>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">

      <div class="stage" id="stage-progress">
        <div class="vinyl-wrap">
          <svg class="ring" id="ring" viewBox="0 0 260 260" aria-hidden="true">
            <circle class="ring-bg" cx="130" cy="130" r="120"/>
            <circle class="ring-fg" id="ring-fg" cx="130" cy="130" r="120"/>
          </svg>
          <div class="vinyl">
            <div class="vinyl-label" id="vinyl-label"></div>
          </div>
        </div>
        <div class="percent" id="percent">…</div>
        <div class="status-text" id="status-text">Préparation…</div>
        <div class="job-title" id="job-title"></div>
        <div class="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="stage" id="stage-done" hidden>
        <svg class="big-icon success" aria-hidden="true"><use href="#i-check"/></svg>
        <div class="done-title">C'est prêt !</div>
        <div class="job-title" id="done-filename"></div>
        <p class="done-hint">Le fichier se télécharge tout seul.<br>S'il ne se passe rien, appuie sur le bouton :</p>
        <button type="button" class="btn btn-go" id="save-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
          Enregistrer le fichier
        </button>
        <button type="button" class="btn btn-ghost" id="again-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
          Convertir autre chose
        </button>
      </div>

      <div class="stage" id="stage-error" hidden>
        <svg class="big-icon failure" aria-hidden="true"><use href="#i-sad"/></svg>
        <div class="done-title">Oups…</div>
        <p class="done-hint" id="error-text"></p>
        <button type="button" class="btn btn-go" id="retry-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
          Réessayer
        </button>
        <button type="button" class="btn btn-ghost" id="close-btn">Fermer</button>
      </div>

    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
